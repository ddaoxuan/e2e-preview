name: E2E

on:
  repository_dispatch:
    types: ['vercel.deployment.ready']

jobs:
  resolve-pr:
    if: github.event.client_payload.environment == 'preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.client_payload.git.sha }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/commits/$SHA/pulls" \
                --jq 'map(select(.state=="open")) | .[0].number // empty')
          echo "number=$n" >> "$GITHUB_OUTPUT"

  e2e:
    needs: resolve-pr
    if: needs.resolve-pr.outputs.number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Report E2E pending on the preview commit
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.client_payload.git.sha,
              context: 'E2E / Preview',
              state: 'pending',
              description: 'Running Playwright against the preview deployment',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - uses: vercel/repository-dispatch/actions/checkout@v1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          BASE_URL: ${{ github.event.client_payload.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  report-e2e:
    needs: [resolve-pr, e2e]
    if: ${{ always() && needs.resolve-pr.outputs.number != '' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report E2E result on the preview commit
        uses: actions/github-script@v7
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        with:
          script: |
            const result = process.env.E2E_RESULT;
            const state = result === 'success' ? 'success'
              : result === 'failure' ? 'failure' : 'error';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.client_payload.git.sha,
              context: 'E2E / Preview',
              state,
              description: `Preview E2E job: ${result}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
