name: E2E - PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: e2e-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  wait-for-preview:
    name: Wait for PR preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      deployments: read
    outputs:
      url: ${{ steps.preview.outputs.url }}
    steps:
      - name: Wait up to 10 minutes for this exact commit
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const deadline = Date.now() + 20 * 60 * 1000;
            const terminalFailures = new Set(['failure', 'error', 'inactive']);

            while (Date.now() < deadline) {
              const deployments = await github.paginate(github.rest.repos.listDeployments, {
                ...context.repo,
                sha,
                environment: 'Preview',
                per_page: 100,
              });
              // On redeploys, wait for the newest deployment, never an older success.
              const deployment = deployments
                .filter(item => item.sha === sha && item.environment === 'Preview')
                .sort((a, b) => b.id - a.id)[0];

              if (deployment) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  ...context.repo,
                  deployment_id: deployment.id,
                  per_page: 1,
                });
                const status = statuses[0];
                core.info(`Deployment ${deployment.id} for ${sha}: ${status?.state ?? 'no status yet'}`);

                if (status?.state === 'success') {
                  const url = new URL(status.environment_url);
                  if (url.protocol !== 'https:' || url.username || url.password) {
                    throw new Error('Expected an HTTPS preview URL without credentials');
                  }
                  core.setOutput('url', url.href);
                  return;
                }
                if (terminalFailures.has(status?.state)) {
                  throw new Error(`Preview deployment ${deployment.id} for ${sha} ended with ${status.state}. Redeploy and rerun this workflow.`);
                }
              } else {
                core.info(`No Preview deployment found for ${sha} yet.`);
              }

              const remaining = deadline - Date.now();
              if (remaining > 0) {
                await new Promise(resolve => setTimeout(resolve, Math.min(60_000, remaining)));
              }
            }
            throw new Error(`Timed out after 20 minutes waiting for a successful Preview deployment for ${sha}.`);

  e2e:
    name: E2E / PR preview
    needs: wait-for-preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          BASE_URL: ${{ needs.wait-for-preview.outputs.url }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-pr-${{ github.event.pull_request.number }}
          path: playwright-report/
          retention-days: 14

  result:
    name: E2E / PR result
    needs: [wait-for-preview, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require a ready preview and passing tests
        env:
          WAIT_RESULT: ${{ needs.wait-for-preview.result }}
          TEST_RESULT: ${{ needs.e2e.result }}
        run: |
          if [ "$WAIT_RESULT" != success ] || [ "$TEST_RESULT" != success ]; then
            echo "Preview wait: $WAIT_RESULT; E2E: $TEST_RESULT"
            exit 1
          fi
