name: E2E - Every preview

on:
  deployment_status:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E / Every preview
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = new URL(context.payload.deployment_status.environment_url);
            if (url.protocol !== 'https:' || url.username || url.password) {
              throw new Error('Expected an HTTPS preview URL without credentials');
            }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-every-preview-${{ github.event.deployment.id }}
          path: playwright-report/
          retention-days: 14
